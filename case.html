<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryu XP NFC Official</title>
<style>
*{
  box-sizing:border-box;
}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
}
body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 10%,#00bfff44,transparent 35%),
    radial-gradient(circle at 20% 80%,#00ffcc22,transparent 30%),
    linear-gradient(135deg,#020617,#050505,#111827);
  color:white;
  overflow:hidden;
}
/* MAIN */
.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
}
/* CARD */
.card{
  width:100%;
  max-width:520px;
  padding:45px 30px;
  text-align:center;
  border-radius:30px;
  background:rgba(15,23,42,.72);
  border:1px solid rgba(0,191,255,.25);
  backdrop-filter:blur(20px);
  box-shadow:
    0 0 60px rgba(0,191,255,.15),
    inset 0 0 30px rgba(255,255,255,.02);
  animation:fadeUp 1s ease;
}
/* NFC ICON */
.nfc{
  width:120px;
  height:120px;
  margin:0 auto 25px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:55px;
  background:
    linear-gradient(135deg,#00bfff,#00ffcc);
  color:#001014;
  box-shadow:
    0 0 20px #00bfff,
    0 0 50px #00bfff55;
  animation:
    pulse 2s infinite,
    float 3s ease-in-out infinite;
}
/* TITLE */
h1{
  margin:10px 0;
  font-size:32px;
  background:
    linear-gradient(90deg,#00bfff,#00ffcc);
  -webkit-background-clip:text;
  color:transparent;
}
/* TEXT */
.subtitle{
  font-size:20px;
  font-weight:bold;
  margin-top:10px;
}
.description{
  margin-top:15px;
  line-height:1.7;
  color:#cbd5e1;
}
/* VERIFIED */
.verified{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:20px;
  padding:8px 15px;
  border-radius:30px;
  background:#00ffcc15;
  border:1px solid #00ffcc55;
  color:#00ffcc;
  font-size:14px;
}
/* BUTTON */
.btn{
  display:block;
  margin-top:30px;
  padding:16px 25px;
  border-radius:30px;
  background:
    linear-gradient(90deg,#00bfff,#00ffcc);
  color:#001014;
  font-size:17px;
  font-weight:bold;
  text-decoration:none;
  transition:.3s;
  box-shadow:
    0 0 20px #00bfff55;
}
.btn:hover{
  transform:scale(1.05);
  box-shadow:
    0 0 35px #00bfff;
}
/* FOOTER */
.footer{
  margin-top:25px;
  font-size:13px;
  color:#64748b;
}
/* ANIMATION */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(40px) scale(.95);
  }
  to{
    opacity:1;
    transform:none;
  }
}
@keyframes pulse{
  0%,100%{
    box-shadow:
      0 0 20px #00bfff,
      0 0 50px #00bfff55;
  }
  50%{
    box-shadow:
      0 0 35px #00bfff,
      0 0 80px #00ffcc55;
  }
}
@keyframes float{
  50%{
    transform:translateY(-10px);
  }
}
/* MOBILE */
@media(max-width:600px){
  .card{
    padding:35px 22px;
    border-radius:25px;
  }
  .nfc{
    width:105px;
    height:105px;
    font-size:48px;
  }
  h1{
    font-size:27px;
  }
  .subtitle{
    font-size:18px;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="card">
<div class="nfc">
  📡
</div>
<div class="verified">
  ✓ NFC Chip Detected
</div>
<h1>
  คุณได้สแกน NFC
</h1>
<div class="subtitle">
  จากเคสมือถือ Ryu XP
</div>
<p class="description">
  ยินดีต้อนรับเข้าสู่ NFC Official ของ
  <strong>Ryu XP</strong>
  <br>
  คุณสามารถเข้าสู่เว็บไซต์อย่างเป็นทางการ
  เพื่อดูวิดีโอ ร้านค้า และข้อมูลต่าง ๆ
</p>
<a
  class="btn"
  href="https://ryuxp.vercel.app/"
>
  🚀 เข้าสู่เว็บไซต์ Ryu XP
</a>
<div class="footer">
  Ryu XP • Official Website
</div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ryu XP Official</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
  radial-gradient(circle at top,#00bfff33,transparent 40%),
  linear-gradient(135deg,#050505,#111827);
  color:white;
  overflow-x:hidden;
}


/* NAVBAR */
nav{
  position:sticky;
  top:0;
  z-index:1000;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:15px 25px;

  background:rgba(0,0,0,.5);
  backdrop-filter:blur(15px);
}


/* LOGO */
.logo{
  display:flex;
  align-items:center;
  gap:12px;

  font-size:22px;
  font-weight:bold;
}


.logo img{

  width:45px;
  height:45px;

  border-radius:50%;

  transition:.4s;

}


.logo img:hover{

  transform:rotate(15deg) scale(1.15);

  box-shadow:
  0 0 20px #00bfff;

}


.logo span{

  background:linear-gradient(
  90deg,#00bfff,#00ffcc);

  -webkit-background-clip:text;
  color:transparent;

}



/* MENU */
.menu{

  display:flex;
  gap:15px;

}


.menu a{

  color:white;

  text-decoration:none;

  padding:10px 15px;

  border-radius:10px;

  transition:.3s;

}


.menu a:hover{

  background:#00bfff;

  color:black;

  transform:translateY(-3px);

}



/* MENU BUTTON */

.menu-btn{

  display:none;

  font-size:28px;

  cursor:pointer;

  background:#222;

  padding:5px 12px;

  border-radius:10px;

}



/* HERO */

.hero{

  min-height:90vh;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  animation:fade 1s;

}


.hero img{

 width:150px;
 height:150px;

 border-radius:50%;

 margin-bottom:20px;

 animation:float 3s infinite;

 box-shadow:
 0 0 30px #00bfff;

}



.hero h1{

 font-size:50px;

 margin:10px;

 background:
 linear-gradient(90deg,#00bfff,#00ffcc);

 -webkit-background-clip:text;

 color:transparent;

}



.hero p{

 opacity:.8;

 font-size:18px;

}



/* BUTTON */

.btn{

 margin-top:20px;

 padding:14px 35px;

 border-radius:30px;

 background:
 linear-gradient(90deg,#00bfff,#00ffcc);

 color:black;

 font-weight:bold;

 text-decoration:none;

 transition:.3s;

}


.btn:hover{

 transform:scale(1.1);

 box-shadow:
 0 0 30px #00bfff;

}



/* VIDEO CARD */

.video-box{

 padding:40px;

 text-align:center;

}


.card{

 display:inline-block;

 width:300px;

 overflow:hidden;

 border-radius:20px;

 background:#111;

 transition:.4s;

}


.card img{

 width:100%;

}


.card:hover{

 transform:translateY(-10px) scale(1.05);

 box-shadow:
 0 0 30px #00bfff;

}



/* ANIMATION */

@keyframes fade{

 from{

 opacity:0;
 transform:translateY(30px);

 }

 to{

 opacity:1;
 transform:none;

 }

}



@keyframes float{

 50%{

 transform:translateY(-15px);

 }

}



/* MOBILE MENU */

@media(max-width:768px){


.menu-btn{

 display:block;

}



.menu{

 position:absolute;

 top:75px;

 right:15px;


 width:200px;


 flex-direction:column;


 background:rgba(0,0,0,.9);

 backdrop-filter:blur(15px);


 border-radius:15px;


 padding:15px;


 transform:translateX(120%);

 transition:.4s;


}


.menu.show{

 transform:translateX(0);

}


.menu a{

 text-align:center;

}


.hero h1{

 font-size:35px;

}



}



</style>

</head>


<body>


<nav>


<div class="logo">

<img src="ryu.jpg">

<span>Ryu XP</span>

</div>



<div class="menu" id="menu">

<a href="index.html">
Home
</a>

<a href="video.html">
Video
</a>

<a href="shop.html">
      Shop
</a>

<a href="ai.html">
AI
</a>

<a href="contact.html">
Contact
</a>


</div>


<div class="menu-btn" onclick="toggleMenu()">

☰

</div>


</nav>




<section class="hero">


<img src="ryu.jpg">


<h1>
Ryu XP
</h1>


<p>
Official Channel Website
</p>


<a class="btn" href="video.html">

🎬 ดูวิดีโอ

</a>


</section>




<section class="video-box">

<h2>
🔥 Latest Video
</h2>


<div class="card"
onclick="window.open('https://youtu.be/oZdBBCGolVc?si=v-4-CC3lKGaxUrHl')">


<img src="https://i.ytimg.com/vi/oZdBBCGolVc/hqdefault.jpg?sqp=-oaymwE9CNACELwBSFryq4qpAy8IARUAAAAAGAElAADIQj0AgKJDeAHwAQH4Af4JgALQBYoCDAgAEAEYZSBlKGUwDw==&rs=AOn4CLB-fVEBcaWXpzX_2NpzYX7nPIRb9Q">


</div>


</section>



<script>


function toggleMenu(){

document
.getElementById("menu")
.classList.toggle("show");

}


</script>



</body>
</html>

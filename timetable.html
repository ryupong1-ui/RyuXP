<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Table - Ryu XP</title>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
  radial-gradient(circle at top,#00bfff33,transparent 40%),
  linear-gradient(135deg,#050505,#111827);
  color:white;
  overflow-x:hidden;
}
/* =========================
   NAVBAR
========================= */
nav{
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(15px);
}
/* LOGO */
.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:22px;
  font-weight:bold;
}
.logo img{
  width:45px;
  height:45px;
  border-radius:50%;
  transition:.4s;
}
.logo img:hover{
  transform:rotate(15deg) scale(1.15);
  box-shadow:
  0 0 20px #00bfff;
}
.logo span{
  background:
  linear-gradient(90deg,#00bfff,#00ffcc);
  -webkit-background-clip:text;
  color:transparent;
}
/* MENU */
.menu{
  display:flex;
  gap:15px;
}
.menu a{
  color:white;
  text-decoration:none;
  padding:10px 15px;
  border-radius:10px;
  transition:.3s;
}
.menu a:hover{
  background:#00bfff;
  color:black;
  transform:translateY(-3px);
}
/* MENU BUTTON */
.menu-btn{
  display:none;
  font-size:28px;
  cursor:pointer;
  background:#222;
  padding:5px 12px;
  border-radius:10px;
}
/* =========================
   PAGE HEADER
========================= */
.page-header{
  text-align:center;
  padding:70px 20px 30px;
  animation:fade 1s;
}
.page-header h1{
  font-size:50px;
  margin:0 0 10px;
  background:
  linear-gradient(90deg,#00bfff,#00ffcc);
  -webkit-background-clip:text;
  color:transparent;
}
.page-header p{
  opacity:.75;
  font-size:18px;
}
/* =========================
   TIME TABLE
========================= */
.timetable{
  width:min(1100px,92%);
  margin:20px auto 80px;
}
/* DATE */
.date-title{
  margin-top:45px;
  margin-bottom:18px;
  font-size:24px;
  border-left:4px solid #00bfff;
  padding-left:15px;
}
/* CARD */
.schedule-card{
  display:flex;
  gap:20px;
  margin-bottom:18px;
  padding:18px;
  border-radius:20px;
  background:rgba(17,17,17,.75);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(15px);
  transition:.3s;
  animation:fade .6s;
}
.schedule-card:hover{
  transform:translateY(-5px);
  box-shadow:
  0 0 25px #00bfff55;
}
/* THUMBNAIL */
.thumbnail{
  width:260px;
  height:145px;
  flex-shrink:0;
  border-radius:15px;
  overflow:hidden;
  background:#222;
}
.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
}
/* CONTENT */
.schedule-content{
  flex:1;
}
.schedule-title{
  font-size:23px;
  font-weight:bold;
  margin-bottom:8px;
}
.schedule-description{
  opacity:.7;
  margin-bottom:12px;
}
/* TIME */
.schedule-time{
  font-size:16px;
  opacity:.8;
  margin-bottom:10px;
}
/* STATUS */
.status{
  display:inline-block;
  padding:7px 14px;
  border-radius:20px;
  font-size:14px;
  font-weight:bold;
  margin-bottom:12px;
}
/* SOON */
.status.soon{
  background:#facc1530;
  color:#facc15;
  border:1px solid #facc15;
}
/* ON LIVE */
.status.onlive{
  background:#ff000030;
  color:#ff4444;
  border:1px solid #ff4444;
  animation:pulse 1.5s infinite;
}
/* RERUN */
.status.rerun{
  background:#a855f730;
  color:#c084fc;
  border:1px solid #c084fc;
}
/* ON */
.status.on{
  background:#00bfff30;
  color:#00bfff;
  border:1px solid #00bfff;
}
/* COUNTDOWN */
.countdown{
  font-size:15px;
  color:#00ffcc;
  margin-bottom:12px;
  font-weight:bold;
}
/* BUTTON */
.watch-btn{
  display:inline-block;
  padding:10px 22px;
  border-radius:25px;
  background:
  linear-gradient(90deg,#00bfff,#00ffcc);
  color:black;
  font-weight:bold;
  text-decoration:none;
  transition:.3s;
}
.watch-btn:hover{
  transform:scale(1.05);
  box-shadow:
  0 0 20px #00bfff;
}
/* NOTIFICATION */
.notify-btn{
  display:inline-block;
  margin-left:8px;
  padding:10px 18px;
  border-radius:25px;
  background:transparent;
  color:white;
  border:1px solid #00bfff;
  cursor:pointer;
  transition:.3s;
}
.notify-btn:hover{
  background:#00bfff;
  color:black;
}
.notify-btn.active{
  background:#00ffcc;
  color:black;
  border-color:#00ffcc;
}
/* EMPTY */
.empty{
  text-align:center;
  padding:60px 20px;
  opacity:.6;
}
/* =========================
   ANIMATION
========================= */
@keyframes fade{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:none;
  }
}
@keyframes pulse{
  50%{
    box-shadow:
    0 0 20px #ff4444;
  }
}
/* =========================
   MOBILE
========================= */
@media(max-width:768px){
  .menu-btn{
    display:block;
  }
  .menu{
    position:absolute;
    top:75px;
    right:15px;
    width:200px;
    flex-direction:column;
    background:rgba(0,0,0,.9);
    backdrop-filter:blur(15px);
    border-radius:15px;
    padding:15px;
    transform:translateX(120%);
    transition:.4s;
  }
  .menu.show{
    transform:translateX(0);
  }
  .menu a{
    text-align:center;
  }
  .page-header h1{
    font-size:38px;
  }
  .schedule-card{
    flex-direction:column;
  }
  .thumbnail{
    width:100%;
    height:auto;
    aspect-ratio:16/9;
  }
  .schedule-title{
    font-size:20px;
  }
  .notify-btn{
    margin-left:0;
    margin-top:8px;
  }
}
</style>
</head>
<body>
<!-- =========================
     NAVBAR
========================= -->
<nav>
  <div class="logo">
    <img src="ryu.jpg">
    <span>Ryu XP</span>
  </div>
  <div class="menu" id="menu">
    <a href="/">
      Home
    </a>
    <a href="/Video">
      Video
    </a>
    <a href="/Shop">
      Shop
    </a>
    <a href="/Contact">
      Contact
    </a>
    <a href="/TimeTable">
      Time Table
    </a>
  </div>
  <div
    class="menu-btn"
    onclick="toggleMenu()"
  >
    ☰
  </div>
</nav>
<!-- =========================
     HEADER
========================= -->
<section class="page-header">
  <h1>
    📅 Time Table
  </h1>
  <p>
    ตารางการลงคลิปและ LIVE ของ Ryu XP
  </p>
</section>
<!-- =========================
     CONTENT
========================= -->
<main class="timetable" id="timetable">
  <div class="empty">
    กำลังโหลดตาราง...
  </div>
</main>
<script>
/* =========================
   MOBILE MENU
========================= */
function toggleMenu(){
  document
    .getElementById("menu")
    .classList
    .toggle("show");
}
/* =========================
   NOTIFICATION
========================= */
let notificationList =
  JSON.parse(
    localStorage.getItem("ryu_notifications") || "[]"
  );
async function requestNotification(){
  if(
    !("Notification" in window)
  ){
    alert(
      "Browser นี้ไม่รองรับการแจ้งเตือน"
    );
    return false;
  }
  if(
    Notification.permission === "granted"
  ){
    return true;
  }
  if(
    Notification.permission !== "denied"
  ){
    const permission =
      await Notification.requestPermission();
    return permission === "granted";
  }
  return false;
}
/* =========================
   LOAD JSON
========================= */
let timetableData = [];
async function loadTimetable(){
  try{
    const response =
      await fetch(
        "timetable.json?time=" +
        Date.now()
      );
    if(!response.ok){
      throw new Error(
        "ไม่สามารถโหลด timetable.json"
      );
    }
    timetableData =
      await response.json();
    renderTimetable();
  }
  catch(error){
    console.error(error);
    document
      .getElementById("timetable")
      .innerHTML = `
        <div class="empty">
          ❌ ไม่สามารถโหลดตารางได้
          <br><br>
          กรุณาตรวจสอบ
          <b>data base</b>
        </div>
      `;
  }
}
/* =========================
   STATUS
========================= */
function getStatus(item){
  /*
    onlive = Live กำลังออกอากาศ
    rerun  = Live Rerun
    on     = คลิปปกติ
    soon   = เร็วๆนี้
  */
  if(item.status === "onlive"){
    return {
      class:"onlive",
      text:"🔴 ON LIVE"
    };
  }
  if(item.status === "rerun"){
    return {
      class:"rerun",
      text:"🔁 RERUN"
    };
  }
  if(item.status === "on"){
    return {
      class:"on",
      text:"🔵 ON"
    };
  }
  return {
    class:"soon",
    text:"🟡 เร็วๆนี้"
  };
}
/* =========================
   DATE FORMAT
========================= */
function formatDate(date){
  const d =
    new Date(date + "T00:00:00");
  return d.toLocaleDateString(
    "th-TH",
    {
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );
}
/* =========================
   COUNTDOWN
========================= */
function getTargetDate(item){
  return new Date(
    item.date +
    "T" +
    item.time +
    ":00"
  );
}
function countdownText(item){
  const target =
    getTargetDate(item);
  const now =
    new Date();
  const diff =
    target - now;
  if(diff <= 0){
    return "กำลังเริ่ม / เริ่มแล้ว";
  }
  const totalSeconds =
    Math.floor(diff / 1000);
  const days =
    Math.floor(
      totalSeconds / 86400
    );
  const hours =
    Math.floor(
      (totalSeconds % 86400) / 3600
    );
  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );
  const seconds =
    totalSeconds % 60;
  let text = "";
  if(days > 0){
    text += days + " วัน ";
  }
  text +=
    String(hours).padStart(2,"0")
    + ":"
    +
    String(minutes).padStart(2,"0")
    + ":"
    +
    String(seconds).padStart(2,"0");
  return "⏱️ เริ่มใน " + text;
}
/* =========================
   RENDER
========================= */
function renderTimetable(){
  const container =
    document.getElementById(
      "timetable"
    );
  if(
    !Array.isArray(timetableData)
    ||
    timetableData.length === 0
  ){
    container.innerHTML = `
      <div class="empty">
        📅 ยังไม่มีรายการในตาราง
      </div>
    `;
    return;
  }
  /*
    เรียงวันที่ + เวลา
  */
  const sorted =
    [...timetableData]
      .sort(
        (a,b) =>
          getTargetDate(a)
          -
          getTargetDate(b)
      );
  /*
    แยกตามวัน
  */
  const groups = {};
  sorted.forEach(item => {
    if(!groups[item.date]){
      groups[item.date] = [];
    }
    groups[item.date].push(item);
  });
  container.innerHTML = "";
  Object.keys(groups)
    .sort()
    .forEach(date => {
      const title =
        document.createElement(
          "div"
        );
      title.className =
        "date-title";
      title.textContent =
        "📅 " +
        formatDate(date);
      container.appendChild(
        title
      );
      groups[date].forEach(
        item => {
          const status =
            getStatus(item);
          const card =
            document.createElement(
              "div"
            );
          card.className =
            "schedule-card";
          const notificationEnabled =
            notificationList.includes(
              item.id
            );
          card.innerHTML = `
            <div class="thumbnail">
              <img
                src="${item.thumbnail || "ryu.jpg"}"
                alt="${escapeHTML(item.title)}"
                onerror="this.src='ryu.jpg'"
              >
            </div>
            <div class="schedule-content">
              <div class="schedule-title">
                ${escapeHTML(item.title)}
              </div>
              <div class="schedule-description">
                ${escapeHTML(
                  item.description || ""
                )}
              </div>
              <div class="schedule-time">
                🕐 ${item.time} น.
              </div>
              <div class="status ${status.class}">
                ${status.text}
              </div>
              ${
                status.class === "soon"
                ?
                `
                <div
                  class="countdown"
                  data-date="${item.date}"
                  data-time="${item.time}"
                >
                  ${countdownText(item)}
                </div>
                `
                :
                ""
              }
              <div>
                <a
                  class="watch-btn"
                  href="${item.url || "#"}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${
                    status.class === "onlive"
                    ? "🔴 ดู LIVE"
                    :
                    status.class === "rerun"
                    ? "🔁 ดู RERUN"
                    :
                    "▶️ ดูคลิป"
                  }
                </a>
                ${
                  status.class === "soon"
                  ?
                  `
                  <button
                    class="notify-btn ${
                      notificationEnabled
                      ? "active"
                      : ""
                    }"
                    onclick="toggleNotification(${item.id})"
                  >
                    ${
                      notificationEnabled
                      ? "🔔 เปิดแจ้งเตือนแล้ว"
                      : "🔔 แจ้งเตือน"
                    }
                  </button>
                  `
                  :
                  ""
                }
              </div>
            </div>
          `;
          container.appendChild(
            card
          );
        }
      );
    });
}
/* =========================
   NOTIFICATION TOGGLE
========================= */
async function toggleNotification(id){
  const allowed =
    await requestNotification();
  if(!allowed){
    alert(
      "กรุณาอนุญาตการแจ้งเตือนจากเว็บไซต์ก่อน"
    );
    return;
  }
  const index =
    notificationList.indexOf(id);
  if(index === -1){
    notificationList.push(id);
  }
  else{
    notificationList.splice(
      index,
      1
    );
  }
  localStorage.setItem(
    "ryu_notifications",
    JSON.stringify(
      notificationList
    )
  );
  renderTimetable();
}
/* =========================
   SEND NOTIFICATION
========================= */
function checkNotifications(){
  if(
    !("Notification" in window)
    ||
    Notification.permission !== "granted"
  ){
    return;
  }
  const now =
    new Date();
  timetableData.forEach(item => {
    if(
      !notificationList.includes(
        item.id
      )
    ){
      return;
    }
    const target =
      getTargetDate(item);
    const notifyBefore =
      (item.notifyBefore || 30)
      *
      60;
    const diff =
      (target - now) / 1000;
    const notificationKey =
      "notified_" +
      item.id +
      "_" +
      item.date;
    if(
      diff <= notifyBefore
      &&
      diff > notifyBefore - 10
      &&
      !localStorage.getItem(
        notificationKey
      )
    ){
      new Notification(
        "🔔 Ryu XP",
        {
          body:
            item.title +
            "\nเริ่มเวลา " +
            item.time +
            " น.",
          icon:"ryu.jpg"
        }
      );
      localStorage.setItem(
        notificationKey,
        "true"
      );
    }
  });
}
/* =========================
   COUNTDOWN UPDATE
========================= */
function updateCountdown(){
  document
    .querySelectorAll(
      ".countdown"
    )
    .forEach(element => {
      const item = {
        date:
          element.dataset.date,
        time:
          element.dataset.time
      };
      element.textContent =
        countdownText(item);
    });
}
/* =========================
   ESCAPE HTML
========================= */
function escapeHTML(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
/* =========================
   START
========================= */
loadTimetable();
setInterval(
  updateCountdown,
  1000
);
setInterval(
  checkNotifications,
  10000
);
setInterval(
  loadTimetable,
  60000
);
</script>
</body>
</html>

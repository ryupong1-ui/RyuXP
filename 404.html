<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Ryu XP Official</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
  radial-gradient(circle at top,#00bfff33,transparent 40%),
  linear-gradient(135deg,#050505,#111827);
  color:white;
  overflow-x:hidden;
}


/* NAVBAR */
nav{
  position:sticky;
  top:0;
  z-index:1000;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:15px 25px;

  background:rgba(0,0,0,.5);
  backdrop-filter:blur(15px);
}


/* LOGO */
.logo{
  display:flex;
  align-items:center;
  gap:12px;

  font-size:22px;
  font-weight:bold;
}


.logo img{

  width:45px;
  height:45px;

  border-radius:50%;

  transition:.4s;

}


.logo img:hover{

  transform:rotate(15deg) scale(1.15);

  box-shadow:
  0 0 20px #00bfff;

}


.logo span{

  background:linear-gradient(
  90deg,#00bfff,#00ffcc);

  -webkit-background-clip:text;
  color:transparent;

}



/* MENU */
.menu{

  display:flex;
  gap:15px;

}


.menu a{

  color:white;

  text-decoration:none;

  padding:10px 15px;

  border-radius:10px;

  transition:.3s;

}


.menu a:hover{

  background:#00bfff;

  color:black;

  transform:translateY(-3px);

}



/* MENU BUTTON */

.menu-btn{

  display:none;

  font-size:28px;

  cursor:pointer;

  background:#222;

  padding:5px 12px;

  border-radius:10px;

}



/* 404 HERO */

.hero{

  min-height:90vh;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  animation:fade 1s;

}


.error-code{

  font-size:150px;

  line-height:1;

  margin:0;

  font-weight:bold;

  background:
  linear-gradient(90deg,#00bfff,#00ffcc);

  -webkit-background-clip:text;

  color:transparent;

  text-shadow:
  0 0 30px #00bfff66;

  animation:float 3s infinite;

}


.hero h1{

  font-size:35px;

  margin:20px 10px 10px;

}


.hero p{

  opacity:.8;

  font-size:18px;

  margin:5px 20px;

}


/* BUTTON */

.btn{

 margin-top:20px;

 padding:14px 35px;

 border-radius:30px;

 background:
 linear-gradient(90deg,#00bfff,#00ffcc);

 color:black;

 font-weight:bold;

 text-decoration:none;

 transition:.3s;

}


.btn:hover{

 transform:scale(1.1);

 box-shadow:
 0 0 30px #00bfff;

}


/* SECOND BUTTON */

.btn-back{

 margin-top:12px;

 padding:12px 28px;

 border-radius:30px;

 border:1px solid #00bfff;

 background:transparent;

 color:white;

 font-weight:bold;

 text-decoration:none;

 transition:.3s;

}


.btn-back:hover{

 background:#00bfff;

 color:black;

 transform:scale(1.05);

}


/* ANIMATION */

@keyframes fade{

 from{

 opacity:0;
 transform:translateY(30px);

 }

 to{

 opacity:1;
 transform:none;

 }

}



@keyframes float{

 50%{

 transform:translateY(-15px);

 }

}



/* MOBILE MENU */

@media(max-width:768px){


.menu-btn{

 display:block;

}



.menu{

 position:absolute;

 top:75px;

 right:15px;


 width:200px;


 flex-direction:column;


 background:rgba(0,0,0,.9);

 backdrop-filter:blur(15px);


 border-radius:15px;


 padding:15px;


 transform:translateX(120%);

 transition:.4s;


}


.menu.show{

 transform:translateX(0);

}


.menu a{

 text-align:center;

}


.error-code{

 font-size:100px;

}


.hero h1{

 font-size:28px;

}


.hero p{

 font-size:16px;

}



}



</style>

</head>


<body>


<nav>


<div class="logo">

<img src="ryu.jpg">

<span>Ryu XP</span>

</div>



<div class="menu" id="menu">

<a href="/">
      Home
    </a>

    <a href="/Video">
      Video
    </a>

    <a href="/Shop">
      Shop
    </a>

    <a href="/Contact">
      Contact
    </a>


</div>


<div class="menu-btn" onclick="toggleMenu()">

☰

</div>


</nav>



<section class="hero">

<h1 class="error-code">
ERROR 404
</h1>


<h1>
ไม่พบหน้าที่คุณกำลังค้นหา
</h1>


<p>
ขออภัย หน้าที่คุณกำลังค้นหาอาจถูกลบ ย้าย หรือไม่มีอยู่ในระบบ
</p>


<a class="btn" href="/">
🏠 กลับหน้าหลัก
</a>


<a class="btn-back" href="javascript:history.back()">
← ย้อนกลับ
</a>


</section>



<script>


function toggleMenu(){

document
.getElementById("menu")
.classList.toggle("show");

}


</script>



</body>
</html>

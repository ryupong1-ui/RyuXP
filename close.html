<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>เว็บไซต์ปิดชั่วคราว</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans Thai", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f7fa;
    color: #111827;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
    text-align: center;
    background: white;
    padding: 55px 30px;
    border-radius: 24px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

.icon {
    font-size: 64px;
    margin-bottom: 20px;
}

h1 {
    font-size: 32px;
    margin-bottom: 14px;
}

p {
    font-size: 17px;
    line-height: 1.7;
    color: #6b7280;
}

.status {
    display: inline-block;
    margin-top: 25px;
    padding: 10px 18px;
    border-radius: 999px;
    background: #fff7ed;
    color: #ea580c;
    font-size: 14px;
    font-weight: 600;
}

@media (max-width: 480px) {
    .container {
        padding: 45px 22px;
    }

    h1 {
        font-size: 26px;
    }

    p {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="icon">🔧</div>

    <h1>เว็บไซต์ปิดชั่วคราว</h1>

    <p>
        ขณะนี้เว็บไซต์กำลังปิดปรับปรุงชั่วคราว<br>
        ขออภัยในความไม่สะดวก
    </p>

    <div class="status">
        กำลังปรับปรุงเว็บไซต์
    </div>

</div>

</body>
</html>
